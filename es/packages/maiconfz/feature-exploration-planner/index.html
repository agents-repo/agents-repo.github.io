    <h2>Agents</h2>
<pre>- automatic-landscape-researcher: Assumption-first landscape research: proactive search for patterns and competitors, cite sources, label gaps in assumption-log. One-shot.
- feature-definition-planner: Synthesize a feature-brief text output from intake, landscape, and options artifacts. Preserves original user intent. One-shot; planning only.
- feature-exploration-chat: Early brainstorming for app feature ideas from conversation, public URLs, uploads, or pasted sources. Emits idea-brief when evidence exists. Does not produce a full feature-brief or inspect a host tree.
- feature-intake: Ask-first framing of app feature ideas against the host repository. Emits intake-summary and blocking questions only. Does not research or define the full feature brief.
- interactive-landscape-researcher: Ask-first landscape research for app features: propose queries, get approval, cite sources. Assumption-log always empty. Invoked once by the flow (not looped); includes one inline query-approval step.
- options-analyst: Compare feature implementation options, trade-offs, risks, and non-goals against intake and landscape context. One-shot; no Q&amp;A loop.</pre>

<pre># feature-exploration-planner

Explore app feature ideas with ask-first intake, optional landscape
research, options analysis, and a structured **feature-brief** text output.
Chat-web supports early brainstorming. Planning only; does not implement.

This is a `maiconfz` community package, not an official agents-repo product.
Installed agents reply in the **language the user used** (English if mixed
or unclear).

## Objective

Turn a fuzzy app feature idea into a structured **feature-brief** you can
paste into a GitHub issue or feed downstream planning. Sits **upstream** of:

- `maiconfz/github-interactive-issue-implementation-planner` (issue exists)
- `maiconfz/plan-refiner` (implementation plan exists)

Primary output is **text in the conversation** — no markdown file required.
Optional `output-path` writes `feature-brief` to a host file when provided.

## Workflow

```mermaid
flowchart LR
  chat[feature-exploration-chat]
  intake[feature-intake]
  mode[research-mode]
  interactive[interactive-landscape-researcher]
  automatic[automatic-landscape-researcher]
  options[options-analyst]
  define[feature-definition-planner]
  chat --&gt;|&quot;idea-brief&quot;| intake
  intake --&gt; mode
  mode --&gt; interactive
  mode --&gt; automatic
  mode --&gt;|skip| options
  interactive --&gt; options
  automatic --&gt; options
  options --&gt; define
```

**Q&amp;A policy:** one clarification cycle at intake only (blocking questions).
All other agents run one-shot.

## Install

Prefer the official [agents-repo CLI](https://github.com/agents-repo/cli).

```bash

```

```bash

```

- Choose `--targets` for your IDE: `github-copilot`, `cursor`,
